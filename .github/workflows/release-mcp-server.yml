name: Release MCP Server

on:
  push:
    tags: ["mcp-v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g., mcp-v1.0.0) - tag must exist in repo'
        required: true
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: mnemic/knowledge-graph-mcp

jobs:
  release:
    runs-on: depot-ubuntu-24.04-small
    permissions:
      contents: write
      id-token: write
    environment:
      name: release
    strategy:
      matrix:
        variant:
          - name: standalone
            dockerfile: docker/Dockerfile.standalone
            image_suffix: "-standalone"
            tag_latest: "standalone"
            title: "Mnemic MCP Server (Standalone)"
            description: "Standalone Mnemic MCP server for external Neo4j or FalkorDB"
          - name: combined
            dockerfile: docker/Dockerfile
            image_suffix: ""
            tag_latest: "latest"
            title: "FalkorDB + Mnemic MCP Server"
            description: "Combined FalkorDB graph database with Mnemic MCP server"
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Extract and validate version
        id: version
        run: |
          # Extract tag from either push event or manual workflow_dispatch input
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG_FULL="${{ inputs.tag }}"
            TAG_VERSION=${TAG_FULL#mcp-v}
          else
            TAG_VERSION=${GITHUB_REF#refs/tags/mcp-v}
          fi

          # Validate semantic versioning format
          if ! [[ $TAG_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must follow semantic versioning: mcp-vX.Y.Z (e.g., mcp-v1.0.0)"
            echo "Received: mcp-v$TAG_VERSION"
            exit 1
          fi

          # Validate against pyproject.toml version
          PROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('mcp_server/pyproject.toml', 'rb'))['project']['version'])")

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Error: Tag version mcp-v$TAG_VERSION does not match mcp_server/pyproject.toml version $PROJECT_VERSION"
            exit 1
          fi

          echo "version=$PROJECT_VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Depot CLI
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1

      - name: Get latest mnemic version from PyPI
        id: mnemic
        run: |
          # Query PyPI for the latest mnemic version with error handling
          set -eo pipefail

          if ! MNEMIC_VERSION=$(curl -sf https://pypi.org/pypi/mnemic/json | python -c "import sys, json; data=json.load(sys.stdin); print(data['info']['version'])"); then
            echo "Error: Failed to fetch mnemic version from PyPI"
            exit 1
          fi

          if [ -z "$MNEMIC_VERSION" ]; then
            echo "Error: Empty version returned from PyPI"
            exit 1
          fi

          echo "mnemic_version=${MNEMIC_VERSION}" >> $GITHUB_OUTPUT
          echo "Latest Mnemic Core version from PyPI: ${MNEMIC_VERSION}"

      - name: Extract metadata
        id: meta
        run: |
          # Get build date
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Generate Docker metadata
        id: docker_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}${{ matrix.variant.image_suffix }}
            type=raw,value=${{ steps.version.outputs.version }}-mnemic-${{ steps.mnemic.outputs.mnemic_version }}${{ matrix.variant.image_suffix }}
            type=raw,value=${{ matrix.variant.tag_latest }}
          labels: |
            org.opencontainers.image.title=${{ matrix.variant.title }}
            org.opencontainers.image.description=${{ matrix.variant.description }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.vendor=Abishek
            mnemic.core.version=${{ steps.mnemic.outputs.mnemic_version }}

      - name: Build and push Docker image (${{ matrix.variant.name }})
        uses: depot/build-push-action@5f3b3c2e5a00f0093de47f657aeaefcedff27d18 # v1
        with:
          project: v9jv1mlpwc
          context: ./mcp_server
          file: ./mcp_server/${{ matrix.variant.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            MCP_SERVER_VERSION=${{ steps.version.outputs.version }}
            MNEMIC_CORE_VERSION=${{ steps.mnemic.outputs.mnemic_version }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ steps.version.outputs.version }}

      - name: Create release summary
        run: |
          {
            echo "## MCP Server Release Summary - ${{ matrix.variant.title }}"
            echo ""
            echo "**MCP Server Version:** ${{ steps.version.outputs.version }}"
            echo "**Mnemic Core Version:** ${{ steps.mnemic.outputs.mnemic_version }}"
            echo "**Build Date:** ${{ steps.meta.outputs.build_date }}"
            echo ""
            echo "### Docker Image Tags"
            echo "${{ steps.docker_meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/- /'
            echo ""
          } >> $GITHUB_STEP_SUMMARY
